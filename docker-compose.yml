version: '3.8'

services:
  nss-portal:
    build: .
    container_name: nss_bit_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=nss_bit_production_secret_key_2026_change_in_prod
      - INITIAL_ADMIN_EMAIL=sushilkumarv@bit-bangalore.edu.in
      - INITIAL_ADMIN_PASSWORD=NSS@2026
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
    volumes:
      - nss_sqlite_data:/app/data
      - nss_uploads_data:/app/uploads

volumes:
  nss_sqlite_data:
    name: nss_bit_sqlite_data
  nss_uploads_data:
    name: nss_bit_uploads_data
